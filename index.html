<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Lidia Siqueira</title>
<style>
body{font-family:Arial;background:#fff5f7;margin:0}
header{background:#fff;text-align:center;padding:15px;border-bottom:3px solid #b03060;position:relative}
.menu{position:absolute;right:15px;top:15px;font-size:28px;background:none;border:0}
.logo{width:130px;height:130px;border-radius:50%;border:4px solid #b03060}
h1{color:#b03060}
.card{background:#fff;border-radius:12px;padding:15px;margin:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:5px solid #b03060}
.btn{background:#b03060;color:#fff;border:0;padding:12px;width:100%;border-radius:8px;font-weight:bold;margin-top:6px;cursor:pointer}
input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}
#admin{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff5f7;z-index:99;padding:15px;overflow:auto}
</style>
</head>
<body>
<header>
<button class="menu" onclick="abrirAdmin()">...</button>
<img src="logo.png" class="logo" onerror="this.style.display='none'">
<h1>Studio Lidia Siqueira</h1>
<a href="https://wa.me/5591984023502" style="background:#b03060;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none">Agendar WhatsApp</a>
</header>

<div style="max-width:600px;margin:auto">
<h2 style="text-align:center;color:#b03060">Servicos e Valores</h2>
<div id="lista"></div>
<div class="card">
<h3>Agendar</h3>
<input id="nome" placeholder="Seu nome">
<input id="data" type="date">
<select id="hora"><option>08:00</option><option>09:00</option><option>10:00</option><option>14:00</option><option>15:00</option></select>
<div id="resumo"></div>
<button class="btn" style="background:#25D366" onclick="confirmar()">Confirmar</button>
</div>
</div>

<div id="admin">
<h2 style="color:#b03060">Administracao <button onclick="document.getElementById('admin').style.display='none'">X</button></h2>
<div id="conteudoA"></div>
</div>

<script>
var servs = [
["Limpeza de pele profunda",60],
["Drenagem linfatica corporal",130],
["Peeling quimico",350],
["Depilacao a laser",140],
["Botox - 1 area",1200],
["Preenchimento Bigode Chines",1800],
["Harmonizacao Facial",350],
["Fios PDO",500]
];
var sel = null;
function render(){
  var h = "";
  for(var i=0;i<servs.length;i++){
    h += '<div class="card"><b>'+servs[i][0]+'</b><br><b style="color:#b03060">R$ '+servs[i][1].toFixed(2)+'</b><br><button class="btn" onclick="esc('+i+')">Escolher</button></div>';
  }
  document.getElementById('lista').innerHTML = h;
}
function esc(i){
  sel = i;
  document.getElementById('resumo').innerHTML = '<p><b>'+servs[i][0]+'</b><br>Sinal 50%: R$ '+(servs[i][1]/2).toFixed(2)+'<br>PIX: 91984023502</p>';
}
function confirmar(){
  var n = document.getElementById('nome').value;
  var d = document.getElementById('data').value;
  if(sel===null||!n||!d){alert('Escolha servico, nome e data');return;}
  window.open('https://wa.me/5591984023502?text='+encodeURIComponent('Ola sou '+n+' quero '+servs[sel][0]+' dia '+d));
}
function abrirAdmin(){
  if(prompt('Senha:')==='1234'){
    document.getElementById('admin').style.display='block';
    var ha='';
    for(var j=0;j<servs.length;j++){ha+='<div class="card">'+servs[j][0]+' - R$ '+servs[j][1].toFixed(2)+'</div>';}
    document.getElementById('conteudoA').innerHTML=ha;
  }
}
render();
</script>
</body>
</html>
