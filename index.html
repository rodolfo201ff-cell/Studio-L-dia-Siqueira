<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio Lidia Siqueira</title>
<style>body{font-family:Arial;background:#fff5f7;margin:0}header{background:#fff;text-align:center;padding:15px;border-bottom:3px solid #b03060;position:relative}.menu{position:absolute;right:15px;top:15px;font-size:28px;background:none;border:0}.logo{width:130px;height:130px;border-radius:50%;border:4px solid #b03060}h1{color:#b03060}.card{background:#fff;border-radius:12px;padding:15px;margin:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-left:5px solid #b03060}.btn{background:#b03060;color:#fff;border:0;padding:12px;width:100%;border-radius:8px;font-weight:bold;margin-top:6px}.btn-g{background:#25D366}input,select{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}#admin{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff5f7;z-index:99;padding:15px;overflow:auto}.baixo{background:#ffebee;border-left-color:red}.ok{background:#e8f5e9}</style></head>
<body>
<header><button class="menu" onclick="abrirAdmin()">⋮</button><img src="logo.png" class="logo" onerror="this.style.display='none'"><h1>Studio Lidia Siqueira</h1><a href="https://wa.me/5591984023502" style="background:#b03060;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none">Agendar WhatsApp</a></header>
<div style="max-width:600px;margin:auto"><h2 style="text-align:center;color:#b03060">Serviços e Valores</h2><div id="lista"></div>
<div class="card"><h3>Agendar</h3><input id="nome" placeholder="Seu nome"><input id="data" type="date"><select id="hora"><option>08:00</option><option>09:00</option><option>10:00</option><option>14:00</option><option>15:00</option><option>16:00</option></select><div id="resumo"></div><button class="btn btn-g" onclick="confirmar()">Confirmar</button></div></div>
<div id="admin"><div style="display:flex;justify-content:space-between"><h2 style="color:#b03060">Administração</h2><button onclick="this.parentElement.parentElement.style.display='none'">X</button></div>
<input id="buscaA" placeholder="Buscar serviço ou produto..." oninput="renderA()"><div id="btns"><button class="btn" onclick="aba='s';renderA()">Serviços</button><button class="btn" onclick="aba='e';renderA()">Estoque</button></div>
<div id="conteudoA"></div></div>
<script>
var servs=[["Limpeza de pele profunda",60],["Drenagem linfática corporal",130],["Peeling químico",350],["Depilação a laser",140],["Botox - 1 área",1200],["Preenchimento Bigode Chinês",1800],["Harmonização Facial",350],["Fios PDO",500],["Intradermoterapia Capilar",200],["Microagulhamento",250],["Drenagem facial",80],["Design sobrancelhas",35],["Extensão cílios",120],["Lash Lifting",90],["Massagem modeladora",90],["Criolipólise",150]];
var estoque=[
["Creme hidratante facial",12,5],["Creme corporal neutro",8,5],["Luva descartável (caixa)",3,5],["Agulha microagulhamento",20,10],["Ácido peeling químico",4,5],["Sérum vitamina C",6,5],["Máscara facial",15,5],["Óleo massagem",7,5],["Gaze estéril",10,5],["Algodão",9,5],["Toxina botulínica (frasco)",2,2],["Preenchedor ácido hialurônico",2,2],["Fios PDO (pacote)",5,3],["Protetor solar facial",10,5]
];
var sel=null,aba='s';
function render(){var h='';for(var i=0;i<servs.length;i++){h+='<div class="card"><b>'+servs[i][0]+'</b><br><b style="color:#b03060">R$ '+servs[i][1].toFixed(2)+'</b><br><button class="btn" onclick="esc('+i+')">Escolher</button></div>';}document.getElementById('lista').innerHTML=h;}
function esc(i){sel=i;document.getElementById('resumo').innerHTML='<div style="background:#e8f5e9;padding:10px;border-radius:8px">Sinal 50%: R$ '+(servs[i][1]/2).toFixed(2)+'<br>PIX: 91984023502</div>';}
function confirmar(){var n=document.getElementById('nome').value,d=document.getElementById('data').value,hh=document.getElementById('hora').value;if(sel==null||!n||!d){alert('Escolha serviço, nome e data');return;}window.open('https://wa.me/5591984023502?text='+encodeURIComponent('Olá sou '+n+' quero '+servs[sel][0]+' dia '+d+' '+hh));}
function abrirAdmin(){if(prompt('Senha:')==='1234'){document.getElementById('admin').style.display='block';renderA();}}
function renderA(){var q=document.getElementById('buscaA').value.toLowerCase();var h='';
if(aba==='s'){for(var i=0;i<servs.length;i++){if(servs[i][0].toLowerCase().includes(q))h+='<div class="card">'+servs[i][0]+' - R$ '+servs[i][1].toFixed(2)+'</div>';}}
else{var alerta=0;for(var j=0;j<estoque.length;j++){var nome=estoque[j][0],qt=estoque[j][1],min=estoque[j][2];if(!nome.toLowerCase().includes(q))continue;var cls=qt<=min?'baixo':'ok';if(qt<=min)alerta++;h+='<div class="card '+cls+'"><b>'+nome+'</b><br>Qtd: '+qt+' | Mín: '+min+(qt<=min?' <b style="color:red">⚠️ REPOSIÇÃO URGENTE</b>':'')+'<br><button onclick="alt('+j+',1)">+</button> <button onclick="alt('+j+',-1)">-</button></div>';}h='<h3 style="color:red">'+alerta+' itens em alerta</h3>'+h+'<div class="card"><h4>Add produto</h4><input id="np" placeholder="Nome"><input id="qp" type="number" placeholder="Qtd"><input id="mp" type="number" placeholder="Mínimo"><button class="btn" onclick="addP()">Adicionar</button></div>';}
document.getElementById('conteudoA').innerHTML=h;}
function alt(i,d){estoque[i][1]+=d;if(estoque[i][1]<0)estoque[i][1]=0;renderA();}
function addP(){var n=document.getElementById('np').value,q=parseInt(document.getElementById('qp').value)||0,m=parseInt(document.getElementById('mp').value)||5;if(n)estoque.push([n,q,m]);renderA();}
render();
</script></body></html>
